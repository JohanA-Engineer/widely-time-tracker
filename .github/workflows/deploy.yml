name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Las acciones se fijan por SHA de commit (no por etiqueta) para que nadie pueda cambiar
# su código sin que lo notemos. Dependabot (.github/dependabot.yml) propone las actualizaciones.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inyectar Secret de Firebase en env.js
        run: |
          cat << 'EOF' > env.js
          // Generado automáticamente en despliegue desde GitHub Secrets
          window.__ENV__ = {
            FIREBASE_API_KEY: "${{ secrets.FIREBASE_API_KEY }}"
          };
          EOF

      # Solo se publican los archivos que usa la app (no manuales, reglas ni scripts locales)
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html app.js env.js styles.css tailwind.min.css sw.js manifest.json icon-192.svg icon-512.svg _site/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
