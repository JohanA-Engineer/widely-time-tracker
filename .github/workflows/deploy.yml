name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Las acciones se fijan por SHA de commit (no por etiqueta) para que nadie pueda cambiar
# su código sin que lo notemos. Dependabot (.github/dependabot.yml) propone las actualizaciones.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Inyectar Secret de Firebase en env.js
        run: |
          cat << 'EOF' > env.js
          // Generado automáticamente en despliegue desde GitHub Secrets
          window.__ENV__ = {
            FIREBASE_API_KEY: "${{ secrets.FIREBASE_API_KEY }}"
          };
          EOF

      # Solo se publican los archivos que usa la app (no manuales, reglas ni scripts locales)
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html app.js ui-shell.js admin-shell.js nav-wheel.js registro.js env.js styles.css tailwind.min.css sw.js manifest.json icon-192.svg icon-512.svg _site/
          # Versión por despliegue en los archivos de la página: el navegador no puede mezclar
          # un index.html nuevo con un app.js o styles.css viejo guardado en caché
          V="${GITHUB_SHA::8}"
          sed -i \
            -e "s#href=\"tailwind.min.css\"#href=\"tailwind.min.css?v=$V\"#" \
            -e "s#href=\"styles.css\"#href=\"styles.css?v=$V\"#" \
            -e "s#src=\"env.js\"#src=\"env.js?v=$V\"#" \
            -e "s#src=\"app.js\"#src=\"app.js?v=$V\"#" \
            -e "s#src=\"ui-shell.js\"#src=\"ui-shell.js?v=$V\"#" \
            -e "s#src=\"admin-shell.js\"#src=\"admin-shell.js?v=$V\"#" \
            -e "s#src=\"nav-wheel.js\"#src=\"nav-wheel.js?v=$V\"#" \
            -e "s#src=\"registro.js\"#src=\"registro.js?v=$V\"#" \
            _site/index.html
          grep -q "app.js?v=$V" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
